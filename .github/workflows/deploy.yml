name: Deploy to GitHub Pages

on:
  push:
    branches: [ dev, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create config.js with secrets
        run: |
          cat > config.js << 'EOF'
          /**
           * CONFIGURATION FILE - AUTO-GENERATED
           * =====================================
           * This file is automatically generated during deployment
           * using GitHub Secrets. Never edit this file manually.
           */

          const APP_CONFIG = {
            // OpenRouter API Key (from GitHub Secrets)
            OPENROUTER_API_KEY: '${{ secrets.OPENROUTER_API_KEY }}',

            // Chat model to use (from GitHub Secrets)
            CHAT_MODEL: '${{ secrets.CHAT_MODEL || 'anthropic/claude-3.5-sonnet' }}',

            // Enable chat feature
            ENABLE_CHAT: true,

            // Application name
            APP_NAME: '¿Qué hay en el súper?',

            // Version
            VERSION: 'v0.2'
          };

          // Export config
          if (typeof module !== 'undefined' && module.exports) {
            module.exports = APP_CONFIG;
          }
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
